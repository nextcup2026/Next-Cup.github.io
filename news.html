<!DOCTYPE html>
<html lang="it">

<head>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com https://*.gstatic.com https://*.googleapis.com https://*.firebaseio.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://* blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.gstatic.com https://identitytoolkit.googleapis.com;">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Ultime notizie, approfondimenti e aggiornamenti sul torneo S.O.S CUP.">
    <title>S.O.S CUP - Notizie e Aggiornamenti</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

    <!-- Custom Style -->
    <link rel="stylesheet" href="style.css">
    <style>
        .nx-button-hover:hover {
            background: linear-gradient(90deg, #facc15, #f59e0b);
            transform: scale(1.02);
        }

        .modal-backdrop {
            background: rgba(0, 0, 0, 0.6);
        }

        .hidden a {
            font-size: 18px;
        }
    </style>
</head>

<body class="antialiased relative">
    <div class="bg-grid"></div>

    <!-- NAVBAR PLACEHOLDER -->
    <div id="navbar-placeholder"></div>


    <section class="relative py-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-5xl md:text-6xl font-extrabold nx-text-gradient leading-tight tech-font">Ultime Notizie
                S.O.S CUP</h1>
            <p class="mt-4 text-gray-300 max-w-2xl mx-auto">Rassegna stampa, risultati, anteprime e aggiornamenti
                organizzativi in tempo reale.</p>

            <div class="mt-8 flex flex-col md:flex-row items-center justify-center gap-4">
                <input id="searchInput" type="search" placeholder="Cerca notizie, squadre, date..."
                    class="w-full md:w-96 px-4 py-3 rounded-lg input-neon" />
                <select id="categoryFilter" class="w-full md:w-56 px-4 py-3 rounded-lg select-tech">
                    <option value="">Tutte le categorie</option>
                </select>
                <button id="refreshBtn"
                    class="px-4 py-3 rounded-lg bg-yellow-500 text-gray-900 font-semibold nx-button-hover">Aggiorna</button>
            </div>
        </div>
    </section>

    <main class="py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-7xl mx-auto">
            <div id="newsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <div id="loadingIndicator" class="col-span-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    <!-- Skeleton 1 -->
                    <div class="glass-panel rounded-xl overflow-hidden shadow-xl h-[400px]">
                        <div class="skeleton h-48 w-full mb-4"></div>
                        <div class="p-6">
                            <div class="skeleton skeleton-text w-1/3 h-4 mb-2"></div>
                            <div class="skeleton skeleton-text w-3/4 h-8 mb-4"></div>
                            <div class="skeleton skeleton-text w-full h-16"></div>
                        </div>
                    </div>
                    <!-- Skeleton 2 -->
                    <div class="glass-panel rounded-xl overflow-hidden shadow-xl h-[400px] hidden md:block">
                        <div class="skeleton h-48 w-full mb-4"></div>
                        <div class="p-6">
                            <div class="skeleton skeleton-text w-1/3 h-4 mb-2"></div>
                            <div class="skeleton skeleton-text w-3/4 h-8 mb-4"></div>
                            <div class="skeleton skeleton-text w-full h-16"></div>
                        </div>
                    </div>
                    <!-- Skeleton 3 -->
                    <div class="glass-panel rounded-xl overflow-hidden shadow-xl h-[400px] hidden lg:block">
                        <div class="skeleton h-48 w-full mb-4"></div>
                        <div class="p-6">
                            <div class="skeleton skeleton-text w-1/3 h-4 mb-2"></div>
                            <div class="skeleton skeleton-text w-3/4 h-8 mb-4"></div>
                            <div class="skeleton skeleton-text w-full h-16"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-12 text-center">
                <a id="archiveBtn" href="#"
                    class="inline-block px-8 py-3 bg-gray-900 border border-gray-700 text-yellow-400 font-semibold rounded-full nx-button-hover shadow-md">Archivio
                    Completo Notizie</a>
            </div>
        </div>
    </main>

    <div id="articleModal" class="fixed inset-0 hidden items-center justify-center z-50">
        <div class="modal-backdrop absolute inset-0"></div>
        <div class="relative max-w-3xl w-[95%] md:w-3/4 bg-gray-900 rounded-xl shadow-2xl overflow-hidden z-50">
            <div class="p-6">
                <div class="flex items-start justify-between gap-4">
                    <div>
                        <h2 id="modalTitle" class="text-2xl font-bold text-white tech-font"></h2>
                        <p id="modalMeta" class="text-sm text-gray-400 mt-1"></p>
                    </div>
                    <button onclick="closeModal()" class="text-gray-300 hover:text-yellow-400">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
                <div id="modalImageWrap" class="mt-4 rounded overflow-hidden">
                    <img id="modalImage" src="" alt="" class="w-full h-56 object-cover rounded" />
                </div>
                <div id="modalBody" class="mt-4 text-gray-200 leading-relaxed"></div>
                <div class="mt-6 flex justify-between items-center">
                    <div class="text-sm text-gray-400" id="modalTags"></div>
                    <div class="flex items-center gap-3">
                        <a id="modalShare" href="#" target="_blank"
                            class="text-yellow-400 hover:text-yellow-300">Condividi</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!--FOOTER PLACEHOLDER-->
    <div id="footer-placeholder"></div>

    <!--SCRIPTS -->
    <script src="config.js"></script>
    <script src="components.js"></script>
    <script>
        renderNavbar();
        renderFooter();
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import {
            getFirestore,
            collection,
            query,
            orderBy,
            onSnapshot
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        /* ---------------- CONFIG ---------------- */

        const firebaseConfig = window.__firebase_config
            ? JSON.parse(window.__firebase_config)
            : null;

        const appId = window.__app_id || "nextcup-app";
        const NEWS_PATH = `artifacts/${appId}/public/data/news`;

        /* ---------------- DOM ---------------- */

        const newsGrid = document.getElementById("newsGrid");
        const searchInput = document.getElementById("searchInput");
        const categoryFilter = document.getElementById("categoryFilter");
        const refreshBtn = document.getElementById("refreshBtn");
        const loadingIndicator = document.getElementById("loadingIndicator");

        const modal = document.getElementById("articleModal");
        const modalTitle = document.getElementById("modalTitle");
        const modalMeta = document.getElementById("modalMeta");
        const modalImage = document.getElementById("modalImage");
        const modalBody = document.getElementById("modalBody");
        const modalTags = document.getElementById("modalTags");

        /* ---------------- STATE ---------------- */

        let db = null;
        let articles = [];

        /* ---------------- HELPERS ---------------- */

        function escapeHtml(str = "") {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        function formatDate(value) {
            if (!value) return 'Data sconosciuta';
            // Se è un oggetto Firestore Timestamp, usa toDate()
            const d = value.toDate ? value.toDate() : new Date(value);

            // Verifica se la data è valida
            if (isNaN(d.getTime())) return 'Data invalida';

            return d.toLocaleString("it-IT", {
                dateStyle: "medium",
                timeStyle: "short"
            });
        }

        function normalizeArticle(raw, id) {
            let newsTimestamp = raw.timestamp || new Date();
            // Gestione dell'oggetto Timestamp di Firebase (se presente)
            if (typeof newsTimestamp === 'object' && newsTimestamp !== null && typeof newsTimestamp.toDate === 'function') {
                // Conversione esplicita dell'oggetto Timestamp in un oggetto Date
                newsTimestamp = newsTimestamp.toDate();
            }

            return {
                id,
                title: raw.title || "Senza titolo",
                // Usa 'content' per l'estratto e il corpo, dato che è il campo salvato
                excerpt: raw.content ? raw.content.substring(0, 150) + (raw.content.length > 150 ? '...' : '') : "Nessun estratto disponibile.",
                body: raw.content || raw.body || "Contenuto non disponibile",
                image: raw.image || "https://placehold.co/900x500/111827/9CA3AF?text=S.O.S+CUP",
                category: raw.category || "Generale",
                timestamp: newsTimestamp, // Usa il timestamp convertito (oggetto Date)
                tags: raw.tags || []
            };
        }

        /* ---------------- RENDER ---------------- */

        function renderCategories() {
            const cats = [...new Set(articles.map(a => a.category))];
            categoryFilter.innerHTML = `<option value="">Tutte le categorie</option>`;
            cats.forEach(c => {
                const o = document.createElement("option");
                o.value = c;
                o.textContent = c;
                categoryFilter.appendChild(o);
            });
        }

        function createCard(a) {
            const el = document.createElement("article");
            el.className =
                "glass-panel rounded-xl overflow-hidden shadow-xl cursor-pointer transition-all duration-300 hover:scale-105";

            el.innerHTML = `
        <img src="${a.image}" class="w-full h-48 object-cover">
        <div class="p-6">
            <p class="text-sm text-yellow-400 font-semibold mb-2">
                ${formatDate(a.timestamp)} • ${a.category}
            </p>
            <h3 class="text-xl font-bold text-white mb-3">
                ${escapeHtml(a.title)}
            </h3>
            <p class="text-gray-400 mb-4 h-12 overflow-hidden">
                ${escapeHtml(a.excerpt)}
            </p>
            <span class="text-yellow-400 font-medium">Leggi di più →</span>
        </div>
    `;

            el.onclick = () => openModal(a);
            return el;
        }

        function renderGrid(list) {
            newsGrid.innerHTML = "";
            if (!list.length) {
                newsGrid.innerHTML = `
            <div class="col-span-full text-center p-8 bg-gray-900 rounded-xl border border-gray-700">
                Nessuna notizia disponibile
            </div>`;
                return;
            }
            list.forEach(a => newsGrid.appendChild(createCard(a)));
        }

        /* ---------------- MODAL ---------------- */

        function openModal(a) {
            modalTitle.textContent = a.title;
            modalMeta.textContent = `${formatDate(a.timestamp)} • ${a.category}`;
            modalImage.src = a.image;
            modalBody.innerHTML = a.body ? `<p>${escapeHtml(a.body)}</p>` : `<p>${escapeHtml(a.excerpt)}</p>`;
            modalTags.innerHTML = a.tags
                .map(t => `<span class="px-2 py-1 bg-gray-800 rounded mr-2">${escapeHtml(t)}</span>`)
                .join("");
            modal.classList.remove("hidden");
            modal.classList.add("flex");
        }

        window.closeModal = function () {
            modal.classList.add("hidden");
            modal.classList.remove("flex");
        };

        /* ---------------- FILTER ---------------- */

        function applyFilters() {
            const q = searchInput.value.toLowerCase();
            const c = categoryFilter.value;

            let filtered = articles;

            if (c) filtered = filtered.filter(a => a.category === c);
            if (q)
                filtered = filtered.filter(a =>
                    (a.title + a.excerpt + a.body).toLowerCase().includes(q)
                );

            renderGrid(filtered);
        }

        /* ---------------- FIRESTORE ---------------- */

        async function init() {
            if (!firebaseConfig) {
                newsGrid.innerHTML = `<div class="col-span-full text-center p-8 bg-red-900/50 text-white rounded-xl border border-red-600">Errore: Configurazione Firebase mancante. Controlla il tag script all'inizio del body.</div>`;
                return;
            }

            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);

            const q = query(
                collection(db, NEWS_PATH),
                // Ordina per timestamp in modo decrescente (più recente in alto)
                orderBy("timestamp", "desc")
            );

            // onSnapshot: Listener in tempo reale
            onSnapshot(q, snap => {
                // Nasconde l'indicatore di caricamento una volta che i dati arrivano
                if (loadingIndicator) loadingIndicator.classList.add('hidden');

                articles = snap.docs.map(d => normalizeArticle(d.data(), d.id));
                renderCategories();
                applyFilters(); // Triggera il rendering della griglia con i nuovi dati
            }, (error) => {
                console.error("Errore nel listener Firestore per le News:", error);
                newsGrid.innerHTML = `<div class="col-span-full text-center p-8 bg-red-800 text-white rounded-xl border border-red-600">Errore nel caricamento delle notizie: ${error.message}</div>`;
                if (loadingIndicator) loadingIndicator.classList.add('hidden');
            });
        }

        /* ---------------- EVENTS ---------------- */

        searchInput.oninput = applyFilters;
        categoryFilter.onchange = applyFilters;
        // Opzione 2: Ricarica pagina completa come richiesto
        refreshBtn.onclick = () => window.location.reload();

        document
            .getElementById("articleModal")
            .addEventListener("click", e => {
                if (e.target === e.currentTarget) closeModal();
            });

        init();
    </script>


    <!-- COOKIE CONSENT BANNER -->

</body>

</html>
