<!DOCTYPE html>
<html lang="it">

<head>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com https://*.gstatic.com https://*.googleapis.com https://*.firebaseio.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://* blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.gstatic.com https://identitytoolkit.googleapis.com;">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Torneo S.O.S CUP - Il torneo giovanile più atteso. Risultati, classifiche e news in tempo reale.">
    <title>S.O.S CUP – Home Page Ufficiale</title>

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="logo%20soscup.jpeg">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

    <!-- Custom Style -->
    <link rel="stylesheet" href="style.css">
    <style>
        .hero-section {
            background-image: linear-gradient(to bottom, rgba(220, 38, 38, 0.2) 0%, rgba(2, 6, 23, 1) 100%);
            background-size: cover;
            background-position: center top;
        }

        .hidden a {
            font-size: 18px;
        }
    </style>
</head>

<body class="antialiased relative">
    <div class="bg-grid"></div>

    <!-- NAVBAR PLACEHOLDER -->
    <div id="navbar-placeholder"></div>

    <!-- HERO -->
    <section class="hero-section min-h-[50vh] flex items-center justify-center pt-32 pb-16">
        <div class="max-w-4xl mx-auto px-6 text-center">

            <h1 class="text-6xl sm:text-7xl lg:text-8xl font-black tracking-tight mb-6 tech-font hidden">
                S.O.S CUP
            </h1>

            <!-- COUNTDOWN -->
            <div id="countdown" class="inline-block bg-gray-950/80 backdrop-blur-md border border-white/20
                    rounded-2xl px-6 py-4 shadow-2xl mb-10 transform sm:scale-110">
                <div class="flex items-center space-x-6 text-center">
                    <div>
                        <div id="days" class="text-4xl font-extrabold nx-text-gradient">00</div>
                        <div class="text-xs text-gray-400 mt-1">GIORNI</div>
                    </div>
                    <div>
                        <div id="hours" class="text-4xl font-extrabold nx-text-gradient">00</div>
                        <div class="text-xs text-gray-400 mt-1">ORE</div>
                    </div>
                    <div>
                        <div id="minutes" class="text-4xl font-extrabold nx-text-gradient">00</div>
                        <div class="text-xs text-gray-400 mt-1">MINUTI</div>
                    </div>
                    <div>
                        <div id="seconds" class="text-4xl font-extrabold nx-text-gradient">00</div>
                        <div class="text-xs text-gray-400 mt-1">SECONDI</div>
                    </div>
                </div>
            </div>

            <!-- CTA -->
            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <a href="regolamento.html" class="btn-cyber text-white font-bold py-3 px-8 rounded-xl
                      shadow-lg flex items-center justify-center">
                    Regolamento
                </a>
                <a href="results.html" class="bg-gray-800 border border-gray-600 text-white font-bold py-3 px-8 rounded-xl
                      hover:bg-gray-700 transition shadow-lg">
                    Risultati & Classifica
                </a>
            </div>
        </div>
    </section>

    <!-- STATISTICHE -->
    <section class="py-20 relative">
        <div class="max-w-7xl mx-auto px-6">
            <h2 class="text-4xl font-bold text-center mb-12 tech-font neon-text">
                Il torneo giovanile più atteso
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="glass-panel p-8 rounded-2xl transition-all hover:-translate-y-2">
                    <p id="teams-count" class="text-5xl font-extrabold nx-text-gradient mb-2 tech-font">
                        <span class="skeleton skeleton-text w-24 h-12 block mx-auto"></span>
                    </p>
                    <p class="font-semibold text-lg text-white">Squadre partecipanti</p>
                    <p class="text-sm text-gray-400 mt-2">
                        Solo i migliori team.
                    </p>
                </div>

                <div class="glass-panel p-8 rounded-2xl transition-all hover:-translate-y-2">
                    <div id="top-scorer-info">
                        <div class="skeleton skeleton-text w-3/4 h-8 mb-2 mx-auto"></div>
                        <div class="skeleton skeleton-text w-1/2 h-6 mx-auto"></div>
                    </div>
                    <p class="font-semibold text-lg text-white mt-2">Top Player</p>
                    <p class="text-sm text-gray-400 mt-1">
                        Capocannoniere del torneo
                    </p>
                </div>

                <div class="glass-panel p-8 rounded-2xl transition-all hover:-translate-y-2">
                    <div id="assist-man-info">
                        <div class="skeleton skeleton-text w-3/4 h-8 mb-2 mx-auto"></div>
                        <div class="skeleton skeleton-text w-1/2 h-6 mx-auto"></div>
                    </div>
                    <p class="font-semibold text-lg text-white mt-2">Assist Man</p>
                    <p class="text-sm text-gray-400 mt-1">
                        Leader degli assist
                    </p>
                </div>
            </div>
        </div>
    </section>

    <!-- PROSSIMA PARTITA -->
    <section class="py-20 bg-gray-950/50 backdrop-blur-sm">
        <div class="max-w-5xl mx-auto px-6 text-center">
            <h2 class="text-4xl font-bold nx-text-gradient mb-10 tech-font">
                Prossima Partita
            </h2>

            <div id="next-match-container">
                <div class="flex flex-col items-center justify-center py-10">
                    <div class="loading-dot mb-4"></div>
                    <p class="text-gray-400 font-semibold animate-pulse">Ricerca prossimo match in corso...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- FOOTER PLACEHOLDER -->
    <div id="footer-placeholder"></div>

    <!-- SCRIPTS -->
    <script src="config.js"></script>
    <script src="components.js"></script>
    <script>
        // Init Components
        renderNavbar();
        renderFooter();

        // Countdown Logic
        const matchDate = new Date("2026-06-26T19:00:00").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const diff = matchDate - now;

            if (diff <= 0) return;

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / (1000 * 60)) % 60);
            const s = Math.floor((diff / 1000) % 60);

            const pad = n => String(n).padStart(2, "0");

            if (document.getElementById('days')) document.getElementById('days').textContent = pad(d);
            if (document.getElementById('hours')) document.getElementById('hours').textContent = pad(h);
            if (document.getElementById('minutes')) document.getElementById('minutes').textContent = pad(m);
            if (document.getElementById('seconds')) document.getElementById('seconds').textContent = pad(s);
        }, 1000);
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy, limit, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(window.__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const APP_ID = window.__app_id;

        async function fetchStats() {
            try {
                // 1. Teams Count
                const teamsSnapshot = await getDocs(collection(db, `artifacts/${APP_ID}/public/data/teams`));
                const count = teamsSnapshot.size;
                const teamsEl = document.getElementById('teams-count');
                if (teamsEl) teamsEl.innerHTML = `${count}/10`;
                
                // Mappa nomi-loghi
                const teamLogos = {};
                teamsSnapshot.forEach(doc => {
                    const t = doc.data();
                    if(t.name) teamLogos[t.name] = t.logoUrl;
                });

                // 2. Top Scorer
                const scorersQuery = query(
                    collection(db, `artifacts/${APP_ID}/public/data/scorers`),
                    where("goals", ">", 0),
                    orderBy("goals", "desc"),
                    limit(1)
                );
                const scorersSnapshot = await getDocs(scorersQuery);
                const scorerContainer = document.getElementById('top-scorer-info');

                if (!scorersSnapshot.empty) {
                    const data = scorersSnapshot.docs[0].data();
                    if (scorerContainer) {
                        scorerContainer.innerHTML = `
                            <p class="text-3xl font-bold nx-text-gradient mb-2 tech-font">${data.name}</p>
                            <p class="font-semibold text-lg text-white">${data.goals} Goal</p>
                        `;
                    }
                } else {
                    if (scorerContainer) {
                        scorerContainer.innerHTML = `
                             <p class="text-3xl font-bold nx-text-gradient mb-2 tech-font">Giocatore Top</p>
                             <p class="font-semibold text-lg text-white">Il torneo deve ancora iniziare!</p>
                        `;
                    }
                }

                // 3. Assist Man
                const assistsQuery = query(
                    collection(db, `artifacts/${APP_ID}/public/data/assists`),
                    where("assists", ">", 0),
                    orderBy("assists", "desc"),
                    limit(1)
                );
                const assistsSnapshot = await getDocs(assistsQuery);
                const assistContainer = document.getElementById('assist-man-info');

                if (!assistsSnapshot.empty) {
                    const data = assistsSnapshot.docs[0].data();
                    if (assistContainer) {
                        assistContainer.innerHTML = `
                            <p class="text-3xl font-bold nx-text-gradient mb-2 tech-font">${data.name}</p>
                            <p class="font-semibold text-lg text-white">${data.assists} Assist</p>
                        `;
                    }
                } else {
                    if (assistContainer) {
                        assistContainer.innerHTML = `
                             <p class="text-3xl font-bold nx-text-gradient mb-2 tech-font">Assist Man</p>
                             <p class="font-semibold text-lg text-white">Il torneo deve ancora iniziare!</p>
                        `;
                    }
                }

                // 4. Prossima Partita
                const nextMatchQuery = query(
                    collection(db, `artifacts/${APP_ID}/public/data/matches`),
                    where("status", "==", "SCHEDULED")
                );
                const nextMatchSnap = await getDocs(nextMatchQuery);
                const nextMatchContainer = document.getElementById('next-match-container');
                
                function escapeHtml(text) {
                    if (!text) return text;
                    return text.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
                }

                if(!nextMatchSnap.empty && nextMatchContainer) {
                    // Ordina i documenti lato Javascript per evitare problemi di Index mancanti in Firebase
                    const scheduledMatches = nextMatchSnap.docs.map(doc => doc.data());
                    scheduledMatches.sort((a, b) => (a.timestamp || '').localeCompare(b.timestamp || ''));
                    
                    const data = scheduledMatches[0];
                    const dateObj = new Date(data.date);
                    const formattedDate = dateObj.toLocaleDateString('it-IT');
                    
                    const logo1 = teamLogos[data.team1] ? `<img src="${teamLogos[data.team1]}" class="w-24 h-24 rounded-full border-4 border-yellow-400 mx-auto mb-2 object-cover">` : `<div class="w-24 h-24 rounded-full border-4 border-yellow-400 mx-auto mb-3 bg-gray-800 flex items-center justify-center font-bold text-xl text-yellow-400">${data.team1.substring(0, 3).toUpperCase()}</div>`;
                    const logo2 = teamLogos[data.team2] ? `<img src="${teamLogos[data.team2]}" class="w-24 h-24 rounded-full border-4 border-gray-600 mx-auto mb-2 object-cover">` : `<div class="w-24 h-24 rounded-full border-4 border-gray-600 mx-auto mb-3 bg-gray-800 flex items-center justify-center font-bold text-xl text-gray-400">${data.team2.substring(0, 3).toUpperCase()}</div>`;

                    nextMatchContainer.innerHTML = `
                        <div class="bg-gradient-to-br from-gray-800 to-gray-900 mx-auto max-w-3xl p-10 rounded-2xl shadow-2xl border border-white/10 hover:border-yellow-400/50 transition duration-300">
                            <p class="text-gray-400 mb-8 font-bold uppercase tracking-widest text-sm bg-gray-950 inline-block px-4 py-2 rounded-full border border-gray-800">
                                ${escapeHtml(data.stage)} · <span class="text-white">${formattedDate} alle ${data.time}</span>
                            </p>
                            <div class="flex justify-center items-center gap-4 sm:gap-10">
                                <div class="text-center w-28 sm:w-32">
                                    ${logo1}
                                    <p class="font-bold text-lg leading-tight mt-2">${escapeHtml(data.team1)}</p>
                                </div>
                                <div class="text-3xl sm:text-5xl font-extrabold text-red-500 animate-pulse drop-shadow-[0_0_10px_rgba(239,68,68,0.8)]">VS</div>
                                <div class="text-center w-28 sm:w-32">
                                    ${logo2}
                                    <p class="font-bold text-lg leading-tight mt-2">${escapeHtml(data.team2)}</p>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (nextMatchContainer) {
                    nextMatchContainer.innerHTML = `<h1 class="text-2xl text-gray-500 font-bold mt-4">Nessun match in programma.</h1>`;
                }

            } catch (error) {
                console.error("Errore recupero statistiche:", error);
                const teamsEl = document.getElementById('teams-count');
                if (teamsEl) teamsEl.textContent = "Err";
            }
        }

        fetchStats();
    </script>


</body>

</html>
