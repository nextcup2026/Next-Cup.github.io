<!DOCTYPE html>
<html lang="it">

<head>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com https://*.gstatic.com https://*.googleapis.com https://*.firebaseio.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://* blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.gstatic.com https://identitytoolkit.googleapis.com;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Vota i migliori giocatori e partecipa ai sondaggi della S.O.S CUP.">
    <title>S.O.S CUP - Sondaggi</title>
    <link rel="icon" type="image/jpeg" href="logo%20soscup.jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="style.css">
    <style>
        .hidden a {
            font-size: 18px;
        }
    </style>
</head>

<body class="antialiased min-h-screen flex flex-col relative">
    <div class="bg-grid"></div>

    <!-- Navbar -->
    <!-- NAVBAR PLACEHOLDER -->
    <div id="navbar-placeholder"></div>


    <main class="flex-grow py-12 px-4 max-w-4xl mx-auto w-full">
        <h1 class="text-5xl font-black text-center nx-text-gradient mb-12 tech-font">SONDAGGI</h1>

        <!-- Active Poll Container -->
        <div id="polls-container" class="space-y-8">
            <!-- Skeleton Poll 1 -->
            <div class="glass-panel rounded-2xl p-8 animate-pulse">
                <div class="h-8 bg-gray-700/50 rounded w-3/4 mb-6"></div>
                <div class="space-y-3">
                    <div class="h-12 bg-gray-800/50 rounded-xl"></div>
                    <div class="h-12 bg-gray-800/50 rounded-xl"></div>
                </div>
            </div>
            <!-- Skeleton Poll 2 -->
            <div class="glass-panel rounded-2xl p-8 animate-pulse hidden md:block">
                <div class="h-8 bg-gray-700/50 rounded w-1/2 mb-6"></div>
                <div class="space-y-3">
                    <div class="h-12 bg-gray-800/50 rounded-xl"></div>
                    <div class="h-12 bg-gray-800/50 rounded-xl"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <!-- FOOTER PLACEHOLDER -->
    <div id="footer-placeholder"></div>

    <!-- SCRIPTS -->
    <script src="config.js"></script>
    <script src="components.js"></script>
    <script>
        renderNavbar();
        renderFooter();
    </script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, increment, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const app = initializeApp(JSON.parse(window.__firebase_config));
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = window.__app_id;

        // AUTH
        signInAnonymously(auth).catch((error) => {
            console.error("Auth failed:", error);
            alert("Errore autenticazione: " + error.message);
        });

        const container = document.getElementById('polls-container');
        const pollsRef = collection(db, `artifacts/${appId}/public/data/polls`);
        const q = query(pollsRef, where("isActive", "==", true));

        onSnapshot(q, (snap) => {
            if (snap.empty) {
                container.innerHTML = `<div class="bg-gray-900/50 p-8 rounded-xl text-center border border-gray-800"><p class="text-gray-400">Nessun sondaggio attivo al momento.</p></div>`;
                return;
            }
            const polls = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderPolls(polls);
        });

        function renderPolls(polls) {
            container.innerHTML = polls.map(poll => {
                const hasVoted = localStorage.getItem(`poll_${poll.id}_voted`);
                const totalVotes = Object.values(poll.votes || {}).reduce((a, b) => a + b, 0) || 1;

                let content = '';

                if (hasVoted) {
                    // SHOW RESULTS
                    const resultsHtml = poll.options.map(op => {
                        const v = (poll.votes && poll.votes[op]) || 0;
                        const pct = Math.round((v / totalVotes) * 100);
                        return `
                        <div class="mb-4">
                            <div class="flex justify-between mb-1">
                                <span class="font-bold text-gray-200">${op}</span>
                                <span class="text-yellow-400 font-mono">${pct}%</span>
                            </div>
                            <div class="w-full bg-gray-700 rounded-full h-3">
                                <div class="bg-yellow-400 h-3 rounded-full transition-all duration-1000" style="width: ${pct}%"></div>
                            </div>
                            <div class="text-xs text-gray-500 mt-1">${v} voti</div>
                        </div>`;
                    }).join('');
                    content = `<div class="space-y-2">${resultsHtml}<p class="text-green-400 text-sm font-semibold mt-4 text-center">Hai votato!</p></div>`;
                } else {
                    // SHOW BUTTONS (Using data attributes to avoid quote issues)
                    const buttonsHtml = poll.options.map(op => {
                        // Safe encoding for HTML attribute not strictly needed if we don't put it in onclick
                        // We use data-option which is safe as long as we use quotes correctly in HTML
                        // But wait, if op has " it breaks data-option="...".
                        // Use &quot; replacement for the attribute value.
                        const safeOp = op.replace(/"/g, '&quot;');
                        return `
                        <button class="vote-btn w-full bg-slate-800 hover:bg-blue-600 text-left px-6 py-4 rounded-xl font-semibold transition border border-gray-700 hover:border-blue-400 flex justify-between items-center group"
                            data-poll-id="${poll.id}" 
                            data-option="${safeOp}">
                            <span>${op}</span>
                            <span class="opacity-0 group-hover:opacity-100 transition">Vota &rarr;</span>
                        </button>
                    `}).join('');
                    content = `<div class="space-y-3">${buttonsHtml}</div>`;
                }

                return `
                <div class="glass-panel rounded-2xl p-8 transition-all hover:scale-[1.01] hover:shadow-2xl">
                    <h2 class="text-2xl font-bold text-white mb-6 tech-font">${poll.question}</h2>
                    ${content}
                </div>
                `;
            }).join('');
        }

        container.addEventListener('click', async (e) => {
            const btn = e.target.closest('.vote-btn');
            if (!btn) return;

            const pollId = btn.dataset.pollId;
            const option = btn.dataset.option;

            if (!pollId || !option) return;

            // Prevent double clicks instantly
            if (localStorage.getItem(`poll_${pollId}_voted`)) return;

            // Disable buttons immediately
            const pollButtons = document.querySelectorAll(`[data-poll-id="${pollId}"]`);
            pollButtons.forEach(b => {
                b.disabled = true;
                b.classList.add('opacity-50', 'cursor-not-allowed');
            });

            // Optimistic lock
            localStorage.setItem(`poll_${pollId}_voted`, 'true');

            try {
                // Check auth
                if (!auth.currentUser) {
                    await signInAnonymously(auth);
                }

                console.log(`Voto per: ${pollId} -> ${option}`);
                const ref = doc(db, `artifacts/${appId}/public/data/polls`, pollId);

                // Use setDoc with merge to ensure we don't fail if the specific field path doesn't exist
                await setDoc(ref, {
                    votes: {
                        [option]: increment(1)
                    }
                }, { merge: true });

                // State update happens via onSnapshot automatically
            } catch (error) {
                console.error("Errore voto:", error);
                localStorage.removeItem(`poll_${pollId}_voted`); // Rollback on fail
                pollButtons.forEach(b => {
                    b.disabled = false;
                    b.classList.remove('opacity-50', 'cursor-not-allowed');
                });
                alert("Impossibile votare: " + error.code + " - " + error.message);
            }
        });
    </script>

    <!-- COOKIE CONSENT BANNER -->

</body>

</html>
