<!DOCTYPE html>
<html lang="it">

<head>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com https://*.gstatic.com https://*.googleapis.com https://*.firebaseio.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://* blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.gstatic.com https://identitytoolkit.googleapis.com;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.O.S CUP - Squadre Iscritte</title>

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="logo%20soscup.jpeg">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

    <!-- Custom Style -->
    <link rel="stylesheet" href="style.css">
    <style>
        .hidden a {
            font-size: 18px;
        }
    </style>
</head>

<body class="antialiased relative">
    <div class="bg-grid"></div>

    <!-- NAVBAR PLACEHOLDER -->
    <div id="navbar-placeholder"></div>

    <!-- SEZIONE SQUADRE -->
    <section class="py-16 px-4 sm:px-6 lg:px-8 bg-gray-800 min-h-screen">
        <div class="max-w-6xl mx-auto">

            <h2 class="text-5xl sm:text-6xl font-extrabold text-center mb-4 nx-text-gradient tech-font neon-text">
                Squadre Partecipanti</h2>
            <p class="text-center text-lg sm:text-xl text-gray-400 mb-12">
                Scopri le formazioni che parteciperanno alla S.O.S Cup.
            </p>

            <div class="text-center mb-10 hidden">
                <a href="admin.html" class="text-red-400 font-bold text-sm underline hover:text-red-300 transition">
                    🔒 Accedi al Pannello Admin
                </a>
            </div>

            <div id="teams-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- SKELETON LOADERS -->
                <div class="glass-panel p-6 rounded-xl flex flex-col items-center h-[400px]">
                    <div class="skeleton skeleton-circle w-32 h-32 mb-4"></div>
                    <div class="skeleton skeleton-text w-3/4 h-8 mb-2"></div>
                    <div class="skeleton skeleton-text w-1/2 h-6 mb-6"></div>
                    <div class="skeleton skeleton-text w-full h-12 mt-auto"></div>
                </div>
                <div class="glass-panel p-6 rounded-xl flex flex-col items-center h-[400px] hidden sm:flex">
                    <div class="skeleton skeleton-circle w-32 h-32 mb-4"></div>
                    <div class="skeleton skeleton-text w-3/4 h-8 mb-2"></div>
                    <div class="skeleton skeleton-text w-1/2 h-6 mb-6"></div>
                    <div class="skeleton skeleton-text w-full h-12 mt-auto"></div>
                </div>
                <div class="glass-panel p-6 rounded-xl flex flex-col items-center h-[400px] hidden lg:flex">
                    <div class="skeleton skeleton-circle w-32 h-32 mb-4"></div>
                    <div class="skeleton skeleton-text w-3/4 h-8 mb-2"></div>
                    <div class="skeleton skeleton-text w-1/2 h-6 mb-6"></div>
                    <div class="skeleton skeleton-text w-full h-12 mt-auto"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- MODALE ROSA SQUADRA -->
    <div id="team-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6 pb-20 pt-20">
        <div class="absolute inset-0 bg-black bg-opacity-80 backdrop-blur-sm transition-opacity"
            onclick="closeTeamModal()"></div>
        <div
            class="relative bg-gray-800 rounded-2xl border border-gray-700 shadow-2xl max-w-4xl w-full max-h-full overflow-y-auto z-10 transform transition-all">
            <!-- Close Button -->
            <button onclick="closeTeamModal()"
                class="absolute top-4 right-4 text-gray-400 hover:text-white bg-gray-900 hover:bg-red-600 rounded-full p-2 transition-colors z-20">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>

            <div class="p-6 sm:p-10">
                <div id="modal-team-info"></div>
                <h3 class="text-2xl font-bold text-yellow-400 border-b border-gray-700 pb-2 mb-6 mt-8 tech-font">ROSA
                    GIOCATORI</h3>
                <div id="modal-team-roster" class="max-h-[50vh] overflow-y-auto pr-2 custom-scrollbar"></div>
            </div>
        </div>
    </div>

    <!-- FOOTER PLACEHOLDER -->
    <div id="footer-placeholder"></div>

    <!-- SCRIPTS -->
    <script src="config.js"></script>
    <script src="components.js"></script>
    <script>
        // Init Components
        renderNavbar();
        renderFooter();
    </script>

    <!-- FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(window.__firebase_config);
        const appId = window.__app_id;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const TEAMS_PATH = `artifacts/${appId}/public/data/teams`;

        // Stats Refs
        const STATS_BASE = `artifacts/${appId}/public/data`;

        // Data Store
        let teamsData = [];
        let statsData = { scorers: [], assists: [], cleanSheets: [], cards: [] };

        // Accesso pubblico
        onAuthStateChanged(auth, (user) => {
            if (!user) signInAnonymously(auth);
        });

        // Helper: Normalize String/Object player to Object
        const normalizePlayer = (p) => {
            if (typeof p === 'string') return { name: p, role: '', number: '', age: '' };
            return p;
        };

        // Helper: Get Player Stats
        const getPlayerStats = (teamName, playerName) => {
            const id =
                `${teamName.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase()}_${playerName.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase()}`;
            const goals = statsData.scorers.find(d => d.id === id)?.goals || 0;
            const assists = statsData.assists.find(d => d.id === id)?.assists || 0;
            const cleanSheets = statsData.cleanSheets.find(d => d.id === id)?.cleanSheets || 0;
            const cardsDoc = statsData.cards.find(d => d.id === id);
            const yellow = cardsDoc?.yellow || 0;
            const red = cardsDoc?.red || 0;
            return { goals, assists, cleanSheets, yellow, red };
        };

        function renderTeams() {
            const grid = document.getElementById("teams-grid");
            const list = teamsData;

            if (list.length === 0) {
                grid.innerHTML = `
                <div class="team-card p-6 rounded-xl shadow-2xl col-span-full text-center">
                    <p class="text-xl text-gray-300 font-semibold">Nessuna squadra iscritta.</p>
                </div>`;
                return;
            }

            grid.innerHTML = list.map(team => `
                <div class="glass-panel p-6 rounded-xl transition-all duration-300 hover:scale-105 hover:shadow-[0_0_20px_rgba(59,130,246,0.5)] flex flex-col items-center justify-between h-full">
                    <div class="flex flex-col items-center w-full mb-6">
                         <div class="relative w-32 h-32 mb-4">
                            ${team.logoUrl
                    ? `<img src="${team.logoUrl}" alt="${team.name} Logo" class="w-full h-full object-contain rounded-full border-4 border-yellow-400 bg-gray-800 shadow-lg">`
                    : `<div class="w-full h-full flex items-center justify-center bg-gray-800 rounded-full border-4 border-gray-700 shadow-lg">
                                        <span class="text-5xl">🛡️</span>
                                   </div>`
                }
                             <div class="absolute -bottom-2 -right-2 bg-gray-900 text-white text-xs font-bold px-2 py-1 rounded-full border border-gray-600">
                                ${team.players ? team.players.length : 0} Player
                             </div>
                        </div>
                        <h3 class="text-3xl font-black text-white text-center tech-font leading-tight mb-2">${team.name}</h3>
                        ${team.president ? `<p class="text-sm text-gray-400 font-semibold">Pres. <span class="text-yellow-400">${team.president}</span></p>` : ''}
                    </div>

                    <button onclick="openTeamDetails('${team.id}')" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3 px-6 rounded-lg transition-colors flex items-center justify-center gap-2">
                        <span>Vedi Rosa</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    </button>
                </div>
            `).join("");
        }

        window.openTeamDetails = (teamId) => {
            const team = teamsData.find(t => t.id === teamId);
            if (!team) return;

            const modalInfo = document.getElementById('modal-team-info');
            const modalRoster = document.getElementById('modal-team-roster');

            // 1. Header Info
            modalInfo.innerHTML = `
                <div class="flex flex-col md:flex-row items-center gap-6 mb-8 bg-gray-800/50 p-6 rounded-2xl border border-gray-700">
                     <div class="w-24 h-24 shrink-0">
                        ${team.logoUrl
                    ? `<img src="${team.logoUrl}" class="w-full h-full object-contain rounded-full border-2 border-yellow-400 bg-gray-900">`
                    : `<div class="w-full h-full flex items-center justify-center bg-gray-900 rounded-full border-2 border-gray-700 text-4xl">🛡️</div>`
                }
                     </div>
                     <div class="text-center md:text-left">
                        <h2 class="text-4xl font-black text-white tech-font mb-2">${team.name}</h2>
                         <div class="flex flex-wrap justify-center md:justify-start gap-4 text-sm text-gray-400">
                            ${team.president ? `<span class="bg-gray-900 px-3 py-1 rounded-full border border-gray-700">👑 Pres. <b class="text-white">${team.president}</b></span>` : ''}
                            ${team.captain ? `<span class="bg-gray-900 px-3 py-1 rounded-full border border-gray-700">© Cap. <b class="text-white">${team.captain}</b></span>` : ''}
                         </div>
                     </div>
                </div>
            `;

            // 2. Roster
            const players = (team.players || []).map(normalizePlayer);

            if (players.length === 0) {
                modalRoster.innerHTML = `<div class="text-gray-500 text-center italic py-8">Nessun giocatore in rosa.</div>`;
            } else {
                modalRoster.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    ${players.map(p => {
                    const stats = getPlayerStats(team.name, p.name);
                    return `
                            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 flex flex-col relative overflow-hidden group hover:border-blue-500/50 transition">
                                <div class="flex justify-between items-start mb-2 relative z-10">
                                    <div>
                                        <div class="font-bold text-white text-lg flex items-center gap-2">
                                            ${p.name}
                                            ${p.number ? `<span class="text-yellow-500 font-mono text-sm bg-yellow-500/10 px-1 rounded">#${p.number}</span>` : ''}
                                        </div>
                                        <div class="text-xs text-blue-400 font-bold uppercase tracking-wider mt-0.5">${p.role || 'Giocatore'}</div>
                                    </div>
                                    ${p.age ? `<div class="text-xs text-gray-500 bg-gray-800 px-2 py-1 rounded-full">${p.age} anni</div>` : ''}
                                </div>

                                <!-- Stats -->
                                <div class="flex flex-wrap gap-2 mt-2 pt-2 border-t border-gray-800 relative z-10">
                                   ${stats.goals > 0 ? `<span class="text-xs bg-yellow-900/30 text-yellow-200 px-2 py-0.5 rounded border border-yellow-700/30" title="Gol">⚽ ${stats.goals}</span>` : ''}
                                   ${stats.assists > 0 ? `<span class="text-xs bg-blue-900/30 text-blue-200 px-2 py-0.5 rounded border border-blue-700/30" title="Assist">🎯 ${stats.assists}</span>` : ''}
                                   ${stats.cleanSheets > 0 ? `<span class="text-xs bg-green-900/30 text-green-200 px-2 py-0.5 rounded border border-green-700/30" title="Clean Sheet">🧤 ${stats.cleanSheets}</span>` : ''}
                                   ${stats.yellow > 0 ? `<span class="text-xs bg-yellow-600/20 text-yellow-500 px-2 py-0.5 rounded border border-yellow-600/30" title="Ammonizioni">🟨 ${stats.yellow}</span>` : ''}
                                   ${stats.red > 0 ? `<span class="text-xs bg-red-900/30 text-red-400 px-2 py-0.5 rounded border border-red-700/30" title="Espulsioni">🟥 ${stats.red}</span>` : ''}
                                   ${stats.goals === 0 && stats.assists === 0 && stats.cleanSheets === 0 && stats.yellow === 0 && stats.red === 0 ? `<span class="text-xs text-gray-700 italic">No stats</span>` : ''}
                                </div>
                            </div>
                         `;
                }).join('')}
                </div>`;
            }

            document.getElementById('team-modal').classList.remove('hidden');
        };

        window.closeTeamModal = () => {
            document.getElementById('team-modal').classList.add('hidden');
        };

        // Listeners
        // 1. Teams
        onSnapshot(collection(db, TEAMS_PATH), (snapshot) => {
            teamsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderTeams();
        });

        // 2. Stats Listeners
        const setupStatListener = (colName) => {
            onSnapshot(collection(db, `${STATS_BASE}/${colName}`), (snap) => {
                statsData[colName] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderTeams();
            });
        };

        ['scorers', 'assists', 'cleanSheets', 'cards'].forEach(setupStatListener);
    </script>


</body>

</html>
