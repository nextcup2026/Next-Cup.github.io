<!DOCTYPE html>
<html lang="it">

<head>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com https://*.gstatic.com https://*.googleapis.com https://*.firebaseio.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://* blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.gstatic.com https://identitytoolkit.googleapis.com;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Statistiche ufficiali S.O.S CUP: marcatori, assist e cartellini aggiornati in tempo reale.">
    <title>S.O.S CUP - Statistiche</title>

    <link rel="icon" type="image/jpeg" href="logo%20soscup.jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

    <!-- Custom Style -->
    <link rel="stylesheet" href="style.css">
    <style>
        .stat-card {
            transition: all .3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, .6);
        }

        .badge {
            padding: .25rem .6rem;
            border-radius: .5rem;
            font-size: .75rem;
            font-weight: 700;
        }

        .hidden a {
            font-size: 18px;
        }

        .stats-list {
            max-height: 400px;
            overflow-y: auto;
        }

        /* Custom scrollbar for webkit */
        .stats-list::-webkit-scrollbar {
            width: 6px;
        }

        .stats-list::-webkit-scrollbar-track {
            bg: #1f2937;
        }

        .stats-list::-webkit-scrollbar-thumb {
            bg: #4b5563;
            border-radius: 3px;
        }
    </style>
</head>

<body class="antialiased relative">
    <div class="bg-grid"></div>

    <!-- NAVBAR PLACEHOLDER -->
    <div id="navbar-placeholder"></div>


    <section class="py-16 px-4 max-w-7xl mx-auto">
        <h1 class="text-5xl sm:text-6xl font-black text-center nx-text-gradient mb-4 tech-font">
            STATISTICHE TORNEO
        </h1>
        <p class="text-center text-gray-400 mb-12">
        </p>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

            <!-- MARCATORI -->
            <div class="glass-panel rounded-xl p-6 transition-all duration-300 hover:scale-[1.02]">
                <h2 class="text-2xl font-bold text-yellow-400 mb-4 tech-font">⚽ Marcatori</h2>
                <div id="scorers" class="space-y-2 text-sm stats-list">
                    <!-- Skeleton -->
                    <div class="animate-pulse space-y-3">
                        <div class="h-4 bg-gray-700/50 rounded w-full"></div>
                        <div class="h-4 bg-gray-700/50 rounded w-full"></div>
                        <div class="h-4 bg-gray-700/50 rounded w-3/4"></div>
                    </div>
                </div>
            </div>

            <!-- ASSIST -->
            <div class="glass-panel rounded-xl p-6 transition-all duration-300 hover:scale-[1.02]">
                <h2 class="text-2xl font-bold text-blue-400 mb-4 tech-font">🎯 Assistman</h2>
                <div id="assists" class="space-y-2 text-sm stats-list">
                    <!-- Skeleton -->
                    <div class="animate-pulse space-y-3">
                        <div class="h-4 bg-gray-700/50 rounded w-full"></div>
                        <div class="h-4 bg-gray-700/50 rounded w-full"></div>
                        <div class="h-4 bg-gray-700/50 rounded w-3/4"></div>
                    </div>
                </div>
            </div>

            <!-- CLEAN SHEET -->
            <div class="glass-panel rounded-xl p-6 transition-all duration-300 hover:scale-[1.02]">
                <h2 class="text-2xl font-bold text-green-400 mb-4 tech-font">🧤 Porta Inviolata</h2>
                <div id="cleanSheets" class="space-y-2 text-sm stats-list">
                    <!-- Skeleton -->
                    <div class="animate-pulse space-y-3">
                        <div class="h-4 bg-gray-700/50 rounded w-full"></div>
                        <div class="h-4 bg-gray-700/50 rounded w-full"></div>
                        <div class="h-4 bg-gray-700/50 rounded w-3/4"></div>
                    </div>
                </div>
            </div>

            <!-- CARTELLINI -->
            <div class="glass-panel rounded-xl p-6 transition-all duration-300 hover:scale-[1.02]">
                <h2 class="text-2xl font-bold text-red-400 mb-4 tech-font">🟨🟥 Cartellini</h2>
                <div id="cards" class="space-y-2 text-sm stats-list">
                    <!-- Skeleton -->
                    <div class="animate-pulse space-y-3">
                        <div class="h-4 bg-gray-700/50 rounded w-full"></div>
                        <div class="h-4 bg-gray-700/50 rounded w-full"></div>
                        <div class="h-4 bg-gray-700/50 rounded w-3/4"></div>
                    </div>
                </div>
            </div>

        </div>
    </section>
    <!-- FOOTER -->
    <!-- FOOTER -->
    <!-- FOOTER PLACEHOLDER -->
    <div id="footer-placeholder"></div>

    <!-- SCRIPTS -->
    <script src="config.js"></script>
    <script src="components.js"></script>
    <script>
        renderNavbar();
        renderFooter();
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(window.__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const base = "artifacts/nextcup-app/public/data";

        function render(list, el, template) {
            const key = Object.keys(template)[0];
            onSnapshot(query(collection(db, base + "/" + list), orderBy(key, "desc")), snap => {
                el.innerHTML = snap.docs
                    .map(d => d.data())
                    .filter(x => {
                        if (list === 'cards') return ((x.yellow || 0) > 0 || (x.red || 0) > 0);
                        return (x[key] || 0) > 0;
                    })
                    .map(x => template.render(x))
                    .join("");
            });
        }

        render("scorers", document.getElementById("scorers"), {
            goals: true,
            render: x => `<div class="flex justify-between">
        <span>${x.name} <span class="text-gray-400">(${x.team})</span></span>
        <span class="font-bold text-yellow-400">${x.goals}</span>
    </div>`
        });

        render("assists", document.getElementById("assists"), {
            assists: true,
            render: x => `<div class="flex justify-between">
        <span>${x.name} <span class="text-gray-400">(${x.team})</span></span>
        <span class="font-bold text-blue-400">${x.assists}</span>
    </div>`
        });

        render("cleanSheets", document.getElementById("cleanSheets"), {
            cleanSheets: true,
            render: x => `<div class="flex justify-between">
        <span>${x.name} <span class="text-gray-400">(${x.team})</span></span>
        <span class="font-bold text-green-400">${x.cleanSheets}</span>
    </div>`
        });

        render("cards", document.getElementById("cards"), {
            yellow: true,
            render: x => `<div class="flex justify-between items-center">
        <span>${x.name} <span class="text-gray-400">(${x.team})</span></span>
        <span>
            <span class="badge bg-yellow-400 text-black">${x.yellow}</span>
            <span class="badge bg-red-600 text-white ml-1">${x.red || 0}</span>
        </span>
    </div>`
        });
    </script>


    <!-- COOKIE CONSENT BANNER -->

</body>

</html>
