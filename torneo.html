<!DOCTYPE html>
<html lang="it">

<head>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com https://*.gstatic.com https://*.googleapis.com https://*.firebaseio.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://* blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.gstatic.com https://identitytoolkit.googleapis.com;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Classifiche, risultati e calendario completo del torneo S.O.S CUP.">
    <title>S.O.S CUP - Torneo</title>

    <link rel="icon" type="image/jpeg" href="logo%20soscup.jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

    <!-- Custom Style -->
    <link rel="stylesheet" href="style.css">
    <style>
        .tab-active {
            border-bottom: 2px solid #FBBF24;
            color: #FBBF24;
        }

        .hidden a {
            font-size: 18px;
        }
    </style>
</head>

<body class="antialiased min-h-screen flex flex-col relative">
    <div class="bg-grid"></div>

    <!-- NAVBAR PLACEHOLDER -->
    <div id="navbar-placeholder"></div>


    <main class="flex-grow py-12 px-4 max-w-7xl mx-auto w-full">
        <h1 class="text-5xl font-black text-center nx-text-gradient mb-12 tech-font">STRUTTURA TORNEO</h1>

        <!-- Tabs -->
        <div class="flex justify-center space-x-8 mb-12 border-b border-gray-800">
            <button id="tab-groups" onclick="switchTab('groups')"
                class="pb-4 px-4 font-bold text-lg tab-active transition">Gironi</button>
            <button id="tab-calendar" onclick="switchTab('calendar')"
                class="pb-4 px-4 font-bold text-lg text-gray-400 hover:text-white transition">Calendario</button>
            <button id="tab-bracket" onclick="switchTab('bracket')"
                class="pb-4 px-4 font-bold text-lg text-gray-400 hover:text-white transition">Tabellone</button>
        </div>

        <!-- CONTENT: GIRONI -->
        <div id="content-groups" class="space-y-12 animate-fade-in">
            <!-- Will be populated by JS -->
            <div id="groups-container" class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Skeleton Group 1 -->
                <div class="glass-panel rounded-xl overflow-hidden shadow-xl animate-pulse">
                    <div class="bg-gray-800 px-6 py-4 border-b border-gray-700 h-16 w-full"></div>
                    <div class="p-4 space-y-4">
                        <div class="h-8 bg-gray-700/50 rounded w-full"></div>
                        <div class="h-8 bg-gray-700/50 rounded w-full"></div>
                        <div class="h-8 bg-gray-700/50 rounded w-full"></div>
                        <div class="h-8 bg-gray-700/50 rounded w-full"></div>
                    </div>
                </div>
                <!-- Skeleton Group 2 -->
                <div class="glass-panel rounded-xl overflow-hidden shadow-xl animate-pulse hidden md:block">
                    <div class="bg-gray-800 px-6 py-4 border-b border-gray-700 h-16 w-full"></div>
                    <div class="p-4 space-y-4">
                        <div class="h-8 bg-gray-700/50 rounded w-full"></div>
                        <div class="h-8 bg-gray-700/50 rounded w-full"></div>
                        <div class="h-8 bg-gray-700/50 rounded w-full"></div>
                        <div class="h-8 bg-gray-700/50 rounded w-full"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- CONTENT: CALENDARIO -->
        <div id="content-calendar" class="hidden">
            <div class="bg-gray-900 rounded-xl p-8 border border-gray-800 text-center">
                <p class="text-gray-400">Calendario in arrivo...</p>
            </div>
        </div>

        <!-- CONTENT: TABELLONE -->
        <div id="content-bracket" class="hidden">
            <div class="bg-gray-900 rounded-xl p-8 border border-gray-800 text-center">
                <p class="text-gray-400">Tabellone in arrivo...</p>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <!-- FOOTER -->
    <!-- FOOTER PLACEHOLDER -->
    <div id="footer-placeholder"></div>

    <!-- SCRIPTS -->
    <script src="config.js"></script>
    <script src="components.js"></script>
    <script>
        renderNavbar();
        renderFooter();
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const app = initializeApp(JSON.parse(window.__firebase_config));
        const db = getFirestore(app);
        const appId = window.__app_id;

        // UI Logic
        window.switchTab = (tab) => {
            document.querySelectorAll('[id^="content-"]').forEach(el => el.classList.add('hidden'));
            document.getElementById(`content-${tab}`).classList.remove('hidden');

            document.querySelectorAll('[id^="tab-"]').forEach(el => {
                el.classList.remove('tab-active', 'text-yellow-400');
                el.classList.add('text-gray-400');
            });
            const btn = document.getElementById(`tab-${tab}`);
            btn.classList.add('tab-active');
            btn.classList.remove('text-gray-400');
        };

        // Data Logic
        const teamsRef = collection(db, `artifacts/${appId}/public/data/teams`);
        const resultsRef = collection(db, `artifacts/${appId}/public/data/results`);
        const matchesRef = collection(db, `artifacts/${appId}/public/data/matches`);

        let teams = [];
        let results = [];
        let matches = [];

        function calculateStandings() {
            const activeTeams = [...teams];

            // Group teams by 'group' field
            const groups = {}; // { 'Unico': [team1, team2], 'B': ... }

            // Initialize stats for all teams
            const teamStats = {};
            activeTeams.forEach(t => {
                const g = t.group || 'Unico'; // Default group Unico
                if (!groups[g]) groups[g] = [];

                // Initialize object if not exists
                if (!teamStats[t.name]) {
                    teamStats[t.name] = {
                        ...t,
                        played: 0, points: 0, gf: 0, ga: 0, dr: 0,
                        history: [] // Array to store 'W', 'D', 'L'
                    };
                } else {
                    teamStats[t.name] = { ...teamStats[t.name], ...t };
                }

                // Add to group list
                if (!groups[g].find(x => x.name === t.name)) {
                    groups[g].push(teamStats[t.name]);
                }
            });

            // Process results (Legacy)
            results.forEach(r => processMatchForStats(r, teamStats));

            // Process Live/Finished Matches from Calendar (New System)
            matches.forEach(m => {
                if ((m.status === 'LIVE' || m.status === 'FINISHED') && m.stage && m.stage.startsWith('Girone')) {
                    // Create a result-like object
                    const resultObj = {
                        team1: m.team1,
                        team2: m.team2,
                        score1: parseInt(m.score1 || 0),
                        score2: parseInt(m.score2 || 0)
                    };
                    processMatchForStats(resultObj, teamStats);
                }
            });

            renderGroups(groups);
            renderBracket();
        }

        function processMatchForStats(r, teamStats) {
            const t1 = teamStats[r.team1];
            const t2 = teamStats[r.team2];
            if (!t1 || !t2) return;

            t1.played++;
            t2.played++;
            t1.gf += parseInt(r.score1);
            t1.ga += parseInt(r.score2);
            t2.gf += parseInt(r.score2);
            t2.ga += parseInt(r.score1);
            t1.dr = t1.gf - t1.ga;
            t2.dr = t2.gf - t2.ga;

            if (parseInt(r.score1) > parseInt(r.score2)) {
                t1.points += 3;
                t1.history.push('W');
                t2.history.push('L');
            } else if (parseInt(r.score2) > parseInt(r.score1)) {
                t2.points += 3;
                t2.history.push('W');
                t1.history.push('L');
            } else {
                t1.points += 1;
                t2.points += 1;
                t1.history.push('D');
                t2.history.push('D');
            }
        }


        function renderGroups(groups) {
            const container = document.getElementById('groups-container');
            container.innerHTML = '';

            const sortedKeys = Object.keys(groups).sort();
            if (sortedKeys.length === 0) {
                container.innerHTML = '<p class="col-span-full text-center text-gray-500">Nessuna squadra trovata.</p>';
                return;
            }

            // Identify teams currently playing
            const liveTeams = new Set();
            matches.forEach(m => {
                if (m.status === 'LIVE') {
                    liveTeams.add(m.team1);
                    liveTeams.add(m.team2);
                }
            });

            sortedKeys.forEach(groupName => {
                const groupTeams = groups[groupName].sort((a, b) => {
                    if (b.points !== a.points) return b.points - a.points;
                    return b.dr - a.dr;
                });

                const renderTableRows = (teamsSubset, startIndex) => {
                    return teamsSubset.map((t, i) => {
                        const globalIndex = startIndex + i + 1;
                        // Form Visualization
                        const formBadges = t.history.slice(-5).reverse().map(res => {
                            if (res === 'W') return `<span class="inline-block w-6 h-6 rounded-full bg-green-500 text-black font-bold text-xs flex items-center justify-center" title="Vittoria">V</span>`;
                            if (res === 'D') return `<span class="inline-block w-6 h-6 rounded-full bg-gray-500 text-white font-bold text-xs flex items-center justify-center" title="Pareggio">N</span>`;
                            if (res === 'L') return `<span class="inline-block w-6 h-6 rounded-full bg-red-500 text-white font-bold text-xs flex items-center justify-center" title="Sconfitta">P</span>`;
                            return '';
                        }).join('<span class="w-1"></span>');

                        const isLive = liveTeams.has(t.name);
                        const wins = t.history.filter(h => h === 'W').length;
                        const draws = t.history.filter(h => h === 'D').length;
                        const losses = t.history.filter(h => h === 'L').length;

                        return `
                                            <tr class="hover:bg-gray-800/50 transition">
                                                <td class="p-4 font-mono text-gray-500">${globalIndex}</td>
                                                <td class="p-4 font-bold text-white flex items-center space-x-3">
                                                    ${t.logoUrl ? `<img src="${t.logoUrl}" class="w-8 h-8 rounded-full bg-gray-700 object-cover border border-gray-600">` : ''}
                                                    <span>${t.name}</span>
                                                    ${isLive ? '<span class="flex h-3 w-3 relative"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opactiy-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span></span>' : ''}
                                                </td>
                                                <td class="p-4 text-center font-extrabold text-yellow-400 text-lg">${t.points}</td>
                                                <td class="p-4 text-center text-gray-400">${t.played}</td>
                                                <td class="p-4 text-center text-gray-400 hidden sm:table-cell">${wins}</td>
                                                <td class="p-4 text-center text-gray-400 hidden sm:table-cell">${draws}</td>
                                                <td class="p-4 text-center text-gray-400 hidden sm:table-cell">${losses}</td>
                                                <td class="p-4 text-center text-gray-400 hidden md:table-cell">${t.gf}</td>
                                                <td class="p-4 text-center text-gray-400 hidden md:table-cell">${t.ga}</td>
                                                <td class="p-4 text-center text-gray-500 hidden sm:table-cell">${t.dr > 0 ? '+' + t.dr : t.dr}</td>
                                                <td class="p-4 text-center hidden md:table-cell">
                                                    <div class="flex items-center justify-center space-x-1">${formBadges || '<span class="text-gray-600">-</span>'}</div>
                                                </td>
                                            </tr>
                                        `;
                    }).join('');
                };

                const html = `
                    <div class="glass-panel rounded-xl overflow-hidden shadow-xl">
                        <div class="bg-gray-800 px-6 py-4 border-b border-gray-700 flex justify-between items-center">
                            <h3 class="text-2xl font-bold text-yellow-400">GIRONE ${groupName}</h3>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="text-gray-400 text-sm border-b border-gray-700">
                                        <th class="p-4 font-semibold">#</th>
                                        <th class="p-4 font-semibold">Squadra</th>
                                        <th class="p-4 font-semibold text-center">PT</th>
                                        <th class="p-4 font-semibold text-center">G</th>
                                        <th class="p-4 font-semibold text-center hidden sm:table-cell">V</th>
                                        <th class="p-4 font-semibold text-center hidden sm:table-cell">N</th>
                                        <th class="p-4 font-semibold text-center hidden sm:table-cell">P</th>
                                        <th class="p-4 font-semibold text-center hidden md:table-cell">GF</th>
                                        <th class="p-4 font-semibold text-center hidden md:table-cell">GS</th>
                                        <th class="p-4 font-semibold text-center hidden sm:table-cell">DR</th>
                                        <th class="p-4 font-semibold text-center hidden md:table-cell">Forma</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-800">
                                    ${renderTableRows(groupTeams, 0)}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        // Helper to escape HTML to prevent XSS
        function escapeHtml(text) {
            if (!text) return text;
            return text
                .toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function renderCalendar() {
            const container = document.getElementById('content-calendar');
            if (matches.length === 0) {
                container.innerHTML = `<div class="bg-gray-900 rounded-xl p-8 border border-gray-800 text-center"><p class="text-gray-400">Nessuna partita programmata al momento.</p></div>`;
                return;
            }

            // FILTER: 
            const scheduled = matches.filter(m => m.status === 'SCHEDULED').sort((a, b) => (a.timestamp || '').localeCompare(b.timestamp || ''));
            // Live and Finished together in "Last Results"? Or Live separate? 
            // User request: "dividile in programma e terminate".
            // Terminata usually implies FINISHED. LIVE is technically active. 
            // Let's put LIVE at the top of "Terminate / Live" or keep them prominent.
            const finished = matches.filter(m => m.status === 'FINISHED' || m.status === 'LIVE').sort((a, b) => {
                if (a.status === 'LIVE' && b.status !== 'LIVE') return -1;
                if (b.status === 'LIVE' && a.status !== 'LIVE') return 1;
                // Newest finished first
                return (b.timestamp || '').localeCompare(a.timestamp || '');
            });

            const renderMatchCard = (m, isInteractive = false) => {
                const isLive = m.status === 'LIVE';
                const isFinished = m.status === 'FINISHED';

                const scoreDisplay = isLive || isFinished
                    ? `<div class="bg-gray-800 px-4 py-2 rounded-lg text-white font-mono font-bold text-2xl border border-gray-700 mx-4 shadow-inner flex items-center justify-center min-w-[100px]">
                            <span class="text-yellow-400">${m.score1 || 0}</span>
                            <span class="mx-2 text-gray-500">-</span>
                            <span class="text-yellow-400">${m.score2 || 0}</span>
                       </div>`
                    : `<div class="bg-gray-800 px-3 py-1 rounded text-gray-500 font-mono font-bold">VS</div>`;

                const statusBadge = isLive
                    ? `<span class="bg-green-500 text-black text-xs font-bold px-3 py-1 rounded-full animate-pulse border border-green-400 shadow-[0_0_10px_rgba(34,197,94,0.5)]">● LIVE</span>`
                    : (isFinished ? `<span class="bg-gray-700 text-gray-300 text-xs px-2 py-1 rounded border border-gray-600">FINALE</span>` : `<span class="bg-gray-800 text-gray-400 text-xs px-2 py-1 rounded border border-gray-700">IN PROGRAMMA</span>`);

                // Interactive wrapper if needed
                // Interactive wrapper - redirect to details page
                const cursorClass = isInteractive ? 'cursor-pointer hover:ring-2 hover:ring-purple-500/50' : '';
                const clickAttr = isInteractive ? `onclick="window.location.href='match_details.html?id=${m.id}'"` : '';

                return `
                        <div class="glass-panel rounded-xl p-6 border-l-4 ${isLive ? 'border-green-500 shadow-[0_0_15px_rgba(34,197,94,0.15)] ring-1 ring-green-900' : 'border-yellow-400 shadow-lg'} flex flex-col items-center justify-between transition-all duration-300 hover:scale-[1.01] ${cursorClass}" ${clickAttr}>
                            <div class="w-full flex flex-col md:flex-row items-center justify-between gap-4">
                                 <div class="text-center md:text-left">
                                    <p class="text-purple-400 font-bold text-sm tracking-widest uppercase mb-1 flex items-center justify-center md:justify-start gap-2">
                                        ${statusBadge}
                                        <span>${escapeHtml(m.stage)}</span>
                                    </p>
                                    <p class="text-lg font-bold text-gray-300 text-center md:text-left">${new Date(m.date).toLocaleDateString('it-IT')} - ${m.time}</p>
                                </div>
                                
                                <div class="flex items-center justify-center w-full md:w-auto flex-1 max-w-lg">
                                    <div class="text-right flex-1">
                                        <span class="text-xl md:text-3xl font-black text-white block leading-tight">${escapeHtml(m.team1)}</span>
                                    </div>
                                    ${scoreDisplay}
                                    <div class="text-left flex-1">
                                        <span class="text-xl md:text-3xl font-black text-white block leading-tight">${escapeHtml(m.team2)}</span>
                                    </div>
                                </div>
                            </div>
                            ${isInteractive ? '<p class="text-gray-500 text-xs mt-4 text-center w-full border-t border-gray-800 pt-2">Clicca per dettagli</p>' : ''}
                        </div>
                    `;
            };

            let html = '<div class="max-w-4xl mx-auto space-y-12">';

            // SECTION 1: SCHEDULED
            if (scheduled.length > 0) {
                html += `
                    <div>
                        <h3 class="text-2xl font-black text-white mb-6 border-l-4 border-yellow-500 pl-4">IN PROGRAMMA</h3>
                        <div class="space-y-4">
                            ${scheduled.map(m => renderMatchCard(m, false)).join('')}
                        </div>
                    </div>
                `;
            }

            // SECTION 2: FINISHED / LIVE
            if (finished.length > 0) {
                html += `
                    <div>
                        <h3 class="text-2xl font-black text-white mb-6 border-l-4 border-green-500 pl-4">LIVE & TERMINATE</h3>
                        <div class="space-y-4">
                            ${finished.map(m => renderMatchCard(m, true)).join('')}
                        </div>
                    </div>
                `;
            }

            html += '</div>';
            container.innerHTML = html;
        }

        function renderBracket() {
            // Visualize bracket based on Results + Scheduled matches filtered by Stage (Quarti, Semi, Finale)
            const stages = ['Ottavi', 'Quarti', 'Semifinale', 'Finale'];
            const container = document.getElementById('content-bracket');

            // Combine results and matches
            // We assume 'results' collection might not have 'stage' field unless we add it. 
            // Currently Results don't have 'stage'. 
            // Ideally we should have migrated them or simply check matches 'scheduled' vs 'finished'.
            // For now, let's just list the "Scheduled" Knockout matches from the Calendar

            const knockoutMatches = matches.filter(m => stages.includes(m.stage));

            if (knockoutMatches.length === 0) {
                container.innerHTML = `<div class="bg-gray-900 rounded-xl p-8 border border-gray-800 text-center"><p class="text-gray-400">Il tabellone sarà disponibile quando verranno programmate le fasi finali.</p></div>`;
                return;
            }

            container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-5xl mx-auto">
                ${knockoutMatches.map(m => `
                    <div class="glass-panel p-6 rounded-xl border border-blue-500/30 relative overflow-hidden transition hover:scale-105">
                        <div class="absolute top-0 right-0 bg-blue-600 text-white text-xs font-bold px-2 py-1 rounded-bl-lg">${escapeHtml(m.stage)}</div>
                        <div class="flex justify-between items-center mt-2">
                             <div class="font-bold text-lg">${escapeHtml(m.team1)}</div>
                             <div class="text-gray-500 text-sm">vs</div>
                             <div class="font-bold text-lg">${escapeHtml(m.team2)}</div>
                        </div>
                        <div class="text-center mt-4 text-sm text-gray-400 font-mono">${m.date} ${m.time}</div>
                    </div>
                `).join('')}
            </div>`;
        }

        // Listeners
        onSnapshot(teamsRef, snap => {
            teams = snap.docs.map(d => d.data());
            if (results.length > 0 || teams.length > 0) calculateStandings();
        });

        onSnapshot(resultsRef, snap => {
            results = snap.docs.map(d => d.data());
            if (teams.length > 0) calculateStandings();
        });

        onSnapshot(matchesRef, snap => {
            matches = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            calculateStandings(); // Fix: Recalculate standings when matches change
            renderCalendar();
            renderBracket();
        });

        // --- PREVIOUSLY MODAL LOGIC REMOVED ---
        // Details are now handled by match_details.html via window.location.href

    </script>

    <!-- COOKIE CONSENT BANNER -->

</body>

</html>
